[project]
name = "sbom-reviewer"
version = "0.1.0"
description = "First pass review of Software Bills of Materials for legal acceleration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3.0",
    "pytest>=9.0.3,<10.0",
]

[project.scripts]
sbom-reviewer = "sbom_reviewer.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbom_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
